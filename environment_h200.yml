name: horizon-h200
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10.20
  - pip=24.3.1
  - setuptools<81.0.0
  - wheel
  # CUDA 12.8 / 13.0 Toolchain & Runtime
  - cuda-toolkit>=12.4
  - cuda-nvcc>=12.4
  - cudatoolkit>=12.4
  - libcurand
  - libcusolver
  - libcusparse
  # Core System & Scientific Libraries
  - libstdcxx-ng>=12.0
  - hdf5>=1.14.0
  - zlib
  - openmpi
  - pip:
    # ─── PyTorch 2.6+ / 2.12+ with CUDA 13.0 / 12.8 Support ───────────────
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - torch>=2.6.0
    - torchvision>=0.21.0
    - torchaudio
    - triton>=3.2.0
    
    # ─── High-Throughput HDF5 & Medical Imaging ───────────────────────────
    - h5py>=3.11.0
    - hdf5plugin>=5.0.0
    - nibabel>=5.2.0
    - SimpleITK>=2.4.0
    - monai>=1.4.0
    - torchio>=1.0.0
    
    # ─── Distributed Multi-GPU (FSDP / DeepSpeed / Accelerate) ─────────────
    - accelerate>=1.2.0
    - deepspeed>=0.16.0
    
    # ─── Foundation Vision & Language Models ──────────────────────────────
    - transformers>=4.48.0
    - tokenizers>=0.21.0
    - safetensors>=0.5.0
    - huggingface-hub>=0.28.0
    - sentencepiece>=0.2.0
    - bitsandbytes>=0.45.0
    - peft>=0.14.0
    - open-clip-torch>=2.24.0
    
    # ─── Survival Analysis & Metric Logging ───────────────────────────────
    - scikit-learn>=1.5.0
    - scipy>=1.14.0
    - numpy>=1.26.0,<2.0.0
    - pandas>=2.2.0
    - pycox>=0.3.0
    - torchtuples>=0.2.2
    - lifelines>=0.29.0
    - einops>=0.8.0
    - timm>=1.0.0
    - pydantic>=2.10.0
    - pytest>=8.3.0
    - rich>=13.9.0
